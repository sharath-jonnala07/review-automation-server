[project]
name = "pulse-agent"
version = "0.1.0"
description = "Weekly Product Review Pulse — AI Agent for automated review analysis"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "alembic>=1.13.0",
    "aiosqlite>=0.20.0",
    "typer>=0.12.0",
    "httpx>=0.27.0",
    "google-play-scraper>=1.2.7",
    "structlog>=24.1.0",
    "jinja2>=3.1.0",
    "python-dotenv>=1.0.0",
    "langchain>=0.2.0",
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
    "langsmith>=0.1.0",
    "sentence-transformers>=3.0.0",
    "transformers>=4.51.0",
    "umap-learn>=0.5.6",
    "hdbscan>=0.8.33",
    "keybert>=0.8.5",
    "numpy>=1.26.0",
    "scikit-learn>=1.5.0",
    "openai>=1.35.0",
    "google-api-python-client>=2.169.0",
    "google-auth>=2.40.0",
    "prometheus-client>=0.20.0",
    "opentelemetry-api>=1.25.0",
    "opentelemetry-sdk>=1.25.0",
    "opentelemetry-instrumentation-fastapi>=0.46b0",
    "email-validator>=2.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.5.0",
    "mypy>=1.10.0",
    "types-python-dateutil>=2.9.0",
    "vcrpy>=6.0.0",
    "respx>=0.21.0",
]

[project.scripts]
pulse = "app.__main__:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
target-version = "py312"
line-length = 100
lint.select = [
    "E",   # pycodestyle errors
    "F",   # Pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "W",   # pycodestyle warnings
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "ARG", # flake8-unused-arguments
    "ERA", # eradicate commented code
    "RUF", # ruff-specific rules
]
lint.ignore = ["E501", "B008", "TC003"]  # Line length handled by formatter

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_ignores = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
ignore_missing_imports = true
show_error_codes = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
asyncio_mode = "auto"
addopts = "--strict-markers --disable-warnings -v"
markers = [
    "unit: Unit tests",
    "integration: Integration tests",
    "e2e: End-to-end tests",
    "slow: Slow tests",
    "live: Tests requiring live network",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
precision = 2
skip_covered = false
show_missing = true
